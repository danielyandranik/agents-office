<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Stencil+Display:wght@800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='16' width='26' height='10' rx='3' fill='%23E3C493'/%3E%3Ccircle cx='16' cy='10' r='6' fill='%23C68B59'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="office-name" id="officeName" title="Rename the office">Agent Office</button>
      <span class="headcount" id="headcount"></span>
      <span class="demo-flag" id="demoFlag" hidden>Demo<span class="long"> — simulated in your browser</span></span>
      <span class="spacer"></span>
      <button class="btn icon-only" id="btnTelegram" aria-label="Telegram" title="Telegram">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2 1.8 7.1c-.5.2-.5.9 0 1.1l3.1 1.1 1.2 3.9c.1.4.6.5.9.2l1.8-1.7 3.2 2.4c.4.3.9.1 1-.4L14.9 2.5c.1-.4-.2-.7-.4-.5Z"/><path d="m4.9 9.3 7-4.6-5.2 5.4"/></svg>
      </button>
      <button class="btn" id="btnBoard" aria-label="Office board" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2.5" width="3.2" height="11" rx="1"/><rect x="6.4" y="2.5" width="3.2" height="7" rx="1"/><rect x="10.8" y="2.5" width="3.2" height="9" rx="1"/></svg>
        <span class="label">Board</span>
      </button>
      <button class="btn" id="btnMissions" aria-label="Missions">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 3.5h11M2.5 8h11M2.5 12.5h7"/></svg>
        <span class="label">Missions</span><span class="count" id="runningCount" hidden></span>
      </button>
      <button class="btn" id="btnNewMission" aria-label="New mission">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 13l3.5-3.5M9.5 2.5l4 4-6 6-4-4z"/></svg>
        <span class="label">New mission</span>
      </button>
      <button class="btn primary" id="btnHire" aria-label="Hire">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        <span class="label">Hire</span>
      </button>
    </header>

    <main class="floor-wrap" id="floorWrap" aria-label="Office floor">
      <div class="stage" id="stage"></div>
    </main>
    <div class="zoom" id="zoomBar" role="group" aria-label="Zoom">
      <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out (⌘/Ctrl + scroll)">−</button>
      <output id="zoomLevel" aria-live="polite">100%</output>
      <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in (⌘/Ctrl + scroll)">+</button>
      <span class="zoom-sep" aria-hidden="true"></span>
      <button type="button" data-zoom="width" title="Fill the window's width">Fit<span class="long"> width</span></button>
      <button type="button" data-zoom="all" title="See the whole office at once">Whole<span class="long"> office</span></button>
    </div>

    <section class="kanban" id="kanban" aria-label="Office board" hidden></section>

    <section class="console" id="console" aria-label="Mission log"></section>

    <aside class="drawer" id="drawer" aria-label="Details"></aside>
  </div>

  <dialog id="dlgHire" aria-labelledby="hireTitle"></dialog>
  <dialog id="dlgMission" class="narrow" aria-labelledby="missionTitle"></dialog>
  <dialog id="dlgSkills" aria-labelledby="skillsTitle"></dialog>
  <dialog id="dlgCard" class="narrow" aria-labelledby="cardTitle"></dialog>
  <dialog id="dlgTelegram" class="narrow" aria-labelledby="telegramTitle"></dialog>
  <div class="toast-host" id="toasts" role="status" aria-live="polite"></div>

  <script src="lib/signalr.min.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
